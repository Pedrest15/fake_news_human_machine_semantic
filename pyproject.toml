[project]
name = "noticias-falsas-humano-maquina-semantica"
version = "0.1.0"
description = "Linguistic characterisation and classification of human-written vs LLM-generated fake news in Brazilian Portuguese"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "grewpy>=0.7.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "gdown>=6.0.0",
    "nltk>=3.9.4",
    "torch>=2.2",
    "transformers>=4.40",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "xgboost>=3.2.0",
    "eon>=1.2",
    "networkx>=3.6.1",
]
[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
